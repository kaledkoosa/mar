<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متجر شحن الألعاب الاحترافي</title>
  <!-- سكربت تليجرام الرسمي للـ Web App -->
  <script src="https://telegram.org"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #17212b);
      --text-color: var(--tg-theme-text-color, #ffffff);
      --hint-color: var(--tg-theme-hint-color, #708499);
      --button-color: var(--tg-theme-button-color, #2481cc);
      --button-text-color: var(--tg-theme-button-text-color, #ffffff);
      --secondary-bg: var(--tg-theme-secondary-bg-color, #202b36);
      --accent-color: #2bb4f6;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
      margin: 0;
      box-sizing: border-box;
    }
    h2 { font-size: 22px; margin-bottom: 5px; color: var(--button-color); }
    .subtitle { color: var(--hint-color); font-size: 14px; margin-bottom: 25px; }
    .card {
      background-color: var(--secondary-bg);
      padding: 20px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      text-align: right;
    }
    .form-group { margin-bottom: 18px; }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 14px;
      color: var(--hint-color);
    }
    select, input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.04);
      color: var(--text-color);
      font-size: 16px;
      box-sizing: border-box;
      transition: all 0.3s ease;
    }
    select:focus, input:focus {
      outline: none;
      border-color: var(--button-color);
      background: rgba(255,255,255,0.08);
    }
    select option { background: #202b36; color: #fff; }
    .btn-submit {
      width: 100%;
      padding: 16px;
      margin-top: 15px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, var(--button-color), var(--accent-color));
      color: var(--button-text-color);
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(36, 129, 204, 0.4);
      transition: transform 0.2s ease;
    }
    .btn-submit:active { transform: scale(0.98); }
  </style>
</head>
<body>

  <h2>🎮 متجر شحن الألعاب السريع</h2>
  <div class="subtitle">شحن فوري ومباشر لجميع ألعابك المفضلة</div>

  <div class="card">
    <div class="form-group">
      <label>🕹️ اختر اللعبة المستهدفة:</label>
      <select id="game" onchange="updatePackages()">
        <option value="pubg">ببجي موبايل (PUBG MOBILE)</option>
        <option value="ff">فري فاير (FREE FIRE)</option>
      </select>
    </div>

    <div class="form-group">
      <label>💎 اختر كمية الشحن والسعر:</label>
      <select id="package">
        <!-- سيتم ملؤها تلقائياً وبشكل فوري وثابت عبر السكربت -->
      </select>
    </div>

    <div class="form-group">
      <label>🆔 معرف اللاعب (Player ID):</label>
      <input type="number" id="playerId" placeholder="أدخل الـ ID الخاص بك هنا" required>
    </div>

    <div class="form-group">
      <label>💳 وسيلة التحويل والدفع اليدوية:</label>
      <select id="payment">
        <option value="shamcash">شام كاش (ShamCash)</option>
        <option value="cwallet">محفظة CWallet (USDT-TRC20)</option>
      </select>
    </div>

    <button class="btn-submit" onclick="sendOrder()">تأكيد الطلب والانتقال للدفع ⚡</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // الباقات الثابتة والمضمونة للظهور فوراً
    const packagesData = {
      pubg: [
        { text: "60 شدة ── 1 دولار", qty: "60 شدة", price: "1" },
        { text: "325 شدة ── 5 دولار", qty: "325 شدة", price: "5" },
        { text: "660 شدة ── 10 دولار", qty: "660 شدة", price: "10" }
      ],
      ff: [
        { text: "100 جوهرة ── 1 دولار", qty: "100 جوهرة", price: "1" },
        { text: "210 جوهرة ── 2 دولار", qty: "210 جوهرة", price: "2" },
        { text: "530 جوهرة ── 5 دولار", qty: "530 جوهرة", price: "5" }
      ]
    };

    function updatePackages() {
      const gameSelect = document.getElementById('game').value;
      const packageSelect = document.getElementById('package');
      packageSelect.innerHTML = '';

      packagesData[gameSelect].forEach(p => {
        let opt = document.createElement('option');
        opt.value = `${p.qty}|${p.price}`;
        opt.innerText = p.text;
        packageSelect.appendChild(opt);
      });
    }

    function sendOrder() {
      const gameSelect = document.getElementById('game');
      const gameName = gameSelect.options[gameSelect.selectedIndex].text;
      const packageValue = document.getElementById('package').value.split('|');
      const playerId = document.getElementById('playerId').value.trim();
      const payment = document.getElementById('payment').value;

      if (!playerId) {
        alert('يرجى كتابة معرف اللاعب الخاص بك أولاً!');
        return;
      }

      const orderData = {
        gameName: gameName,
        packageName: packageValue[0],
        price: packageValue[1],
        playerId: playerId,
        paymentMethod: payment
      };

      // إرسال البيانات وإغلاق الواجهة فوراً
      tg.sendData(JSON.stringify(orderData));
    }

    // تشغيل الدالة فوراً عند فتح الصفحة للتأكد من تعبئة الجدول الأول
    updatePackages();
  </script>
</body>
</html>
