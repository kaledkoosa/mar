<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متجر شحن الألعاب الاحترافي</title>
  <script src="https://telegram.org"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #17212b);
      --text-color: var(--tg-theme-text-color, #ffffff);
      --hint-color: var(--tg-theme-hint-color, #708499);
      --button-color: var(--tg-theme-button-color, #2481cc);
      --button-text-color: var(--tg-theme-button-text-color, #ffffff);
      --secondary-bg: var(--tg-theme-secondary-bg-color, #202b36);
      --accent-color: #2bb4f6;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
      margin: 0;
      box-sizing: border-box;
    }
    h2 { font-size: 22px; margin-bottom: 5px; color: var(--button-color); }
    .subtitle { color: var(--hint-color); font-size: 14px; margin-bottom: 25px; }
    .card {
      background-color: var(--secondary-bg);
      padding: 20px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      text-align: right;
    }
    .form-group { margin-bottom: 18px; }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 14px;
      color: var(--hint-color);
    }
    select, input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.04);
      color: var(--text-color);
      font-size: 16px;
      box-sizing: border-box;
    }
    .btn-submit {
      width: 100%;
      padding: 16px;
      margin-top: 15px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, var(--button-color), var(--accent-color));
      color: var(--button-text-color);
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(36, 129, 204, 0.4);
    }
  </style>
</head>
<body>

  <h2>🎮 متجر شحن الألعاب السريع</h2>
  <div class="subtitle">شحن فوري ومباشر لجميع ألعابك المفضلة</div>

  <div class="card">
    <div class="form-group">
      <label>🕹️ اختر اللعبة المستهدفة:</label>
      <select id="game" onchange="updatePackagesDirectly()">
        <option value="pubg">ببجي موبايل (PUBG MOBILE)</option>
        <option value="ff">فري فاير (FREE FIRE)</option>
      </select>
    </div>

    <div class="form-group">
      <label>💎 اختر كمية الشحن والسعر:</label>
      <select id="package">
        <option value="60 شدة|1">60 شدة ── 1 دولار</option>
        <option value="325 شدة|5">325 شدة ── 5 دولار</option>
        <option value="660 شدة|10">660 شدة ── 10 دولار</option>
      </select>
    </div>

    <div class="form-group">
      <label>🆔 معرف اللاعب (Player ID):</label>
      <input type="text" id="playerId" placeholder="أدخل الـ ID الخاص بك هنا">
    </div>

    <div class="form-group">
      <label>💳 وسيلة التحويل والدفع اليدوية:</label>
      <select id="payment">
        <option value="shamcash">شام كاش (ShamCash)</option>
        <option value="cwallet">محفظة CWallet (USDT-TRC20)</option>
      </select>
    </div>

    <button class="btn-submit" onclick="sendOrder()">تأكيد الطلب والانتقال للدفع ⚡</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    function updatePackagesDirectly() {
      const gameSelect = document.getElementById('game').value;
      const packageSelect = document.getElementById('package');
      packageSelect.innerHTML = '';

      if (gameSelect === 'pubg') {
        packageSelect.innerHTML = `
          <option value="60 شدة|1">60 شدة ── 1 دولار</option>
          <option value="325 شدة|5">325 شدة ── 5 دولار</option>
          <option value="660 شدة|10">660 شدة ── 10 دولار</option>
        `;
      } else if (gameSelect === 'ff') {
        packageSelect.innerHTML = `
          <option value="100 جوهرة|1">100 جوهرة ── 1 دولار</option>
          <option value="210 جوهرة|2">210 جوهرة ── 2 دولار</option>
          <option value="530 جوهرة|5">530 جوهرة ── 5 دولار</option>
        `;
      }
    }

    function sendOrder() {
      const gameSelect = document.getElementById('game');
      const gameName = gameSelect.options[gameSelect.selectedIndex].text;
      
      const packageSelect = document.getElementById('package').value;
      // تفكيك النص والسعر بشكل آمن وصحيح بدون تكرار يسبب تعليق المتصفح
      const packageParts = packageSelect.split('|');
      const qty = packageParts[0];
      const prc = packageParts[1];
      
      let playerId = document.getElementById('playerId').value.trim();
      if (!playerId) {
        alert('يرجى كتابة معرف اللاعب (Player ID) الخاص بك!');
        return;
      }

      const paymentSelect = document.getElementById('payment');
      const paymentMethod = paymentSelect.options[paymentSelect.selectedIndex].value;

      // صياغة البيانات بشكل نصوص صافية وبسيطة جداً
      const orderData = {
        gameName: String(gameName),
        packageName: String(qty),
        price: String(prc),
        playerId: String(playerId),
        paymentMethod: String(paymentMethod)
      };

      // إرسال البيانات المحددة وإغلاق الواجهة فوراً
      tg.sendData(JSON.stringify(orderData));
    }
  </script>
</body>
</html>
