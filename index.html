<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر شحن الألعاب الفوري</title>
    <!-- استدعاء مكتبة تيليجرام الرسمية للتطبيقات المصغرة -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--tg-theme-bg-color, #17212b);
            color: var(--tg-theme-text-color, #f5f5f5);
            margin: 0;
            padding: 15px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .balance-card {
            background: var(--tg-theme-secondary-bg-color, #202b36);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .section-title {
            font-size: 16px;
            margin: 15px 0 10px 0;
            color: #3b9cff;
        }
        .product-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .product-card {
            background: var(--tg-theme-secondary-bg-color, #202b36);
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .product-name {
            font-size: 14px;
            margin-bottom: 8px;
        }
        .product-price {
            font-weight: bold;
            color: #4cd964;
            margin-bottom: 10px;
        }
        .btn {
            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        .deposit-section {
            background: var(--tg-theme-secondary-bg-color, #202b36);
            padding: 15px;
            border-radius: 12px;
            margin-top: 20px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.1);
            background: #17212b;
            color: white;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>🎮 متجر الشحن السريع</h2>
    </div>

    <div class="balance-card">
        💰 رصيدك الحالي: <span id="user-balance">جاري التحميل...</span> $
    </div>

    <div class="section-title">📦 باقات شحن ببجي موبايل (PUBG)</div>
    <div class="product-grid">
        <div class="product-card">
            <div class="product-name">60 شدة PUBG</div>
            <div class="product-price">1.00 $</div>
            <button class="btn" onclick="buyItem('pubg_60', 1.0)">شراء الآن</button>
        </div>
        <div class="product-card">
            <div class="product-name">325 شدة PUBG</div>
            <div class="product-price">5.00 $</div>
            <button class="btn" onclick="buyItem('pubg_325', 5.0)">شراء الآن</button>
        </div>
    </div>

    <div class="section-title">🔥 باقات شحن فري فاير (Free Fire)</div>
    <div class="product-grid">
        <div class="product-card">
            <div class="product-name">100 جوهرة FF</div>
            <div class="product-price">1.00 $</div>
            <button class="btn" onclick="buyItem('ff_100', 1.0)">شراء الآن</button>
        </div>
        <div class="product-card">
            <div class="product-name">310 جوهرة FF</div>
            <div class="product-price">3.00 $</div>
            <button class="btn" onclick="buyItem('ff_310', 3.0)">شراء الآن</button>
        </div>
    </div>

    <div class="deposit-section">
        <div class="section-title" style="margin-top:0;">💳 شحن رصيد الحساب</div>
        <p style="font-size: 13px; color: #aaa;">لشحن حسابك، يرجى تعبئة المعرف الخاص بك وإتمام العملية عبر البوت لتأكيد الإيصال.</p>
        <button class="btn" style="background: #e67e22;" onclick="requestDeposit()">طلب شحن الرصيد</button>
    </div>

    <script>
        // تهيئة تطبيق تيليجرام المصغر
        const tg = window.Telegram.WebApp;
        tg.expand(); // تمديد التطبيق ليأخذ الشاشة كاملة

        // جلب معرف المستخدم تلقائياً
        const urlParams = new URLSearchParams(window.location.search);
        const userBalance = urlParams.get('balance') || '0.0';
        document.getElementById('user-balance').innerText = userBalance;

        function buyItem(itemKey, price) {
            let currentBal = parseFloat(userBalance);
            if (currentBal < price) {
                tg.showAlert("❌ رصيدك الحالي غير كافٍ، يرجى شحن الحساب أولاً!");
                return;
            }
            
            tg.showPopup({
                title: 'تأكيد الشراء',
                message: 'هل أنت متأكد من رغبتك في شراء هذه الباقة؟',
                buttons: [
                    {id: 'ok', type: 'default', text: 'شراء'},
                    {id: 'cancel', type: 'destructive', text: 'إلغاء'}
                ]
            }, function(buttonId) {
                if (buttonId === 'ok') {
                    // إرسال البيانات للبوت لإتمام عملية الخصم وطلب الـ ID
                    tg.sendData(JSON.stringify({action: "buy", item: itemKey}));
                    tg.close();
                }
            });
        }

        function requestDeposit() {
            tg.sendData(JSON.stringify({action: "deposit"}));
            tg.close();
        }
    </script>
</body>
</html>
