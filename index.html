<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر عبد البصير الإلكتروني</title>
    <!-- استدعاء خطوط وأيقونات حديثة -->
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 20px;
        }

        .header-container {
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid #334155;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .welcome-title {
            color: #38bdf8;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .info-bar {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
            background-color: #1e293b;
            padding: 10px;
            border-radius: 10px;
        }

        .info-item {
            font-size: 14px;
        }

        .info-item span {
            color: #4ade80;
            font-weight: bold;
        }

        .input-group {
            margin-bottom: 25px;
            background: #1e293b;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #94a3b8;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #fff;
            font-size: 16px;
            text-align: center;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .product-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            transition: transform 0.2s, border-color 0.2s;
            cursor: pointer;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-3px);
            border-color: #38bdf8;
        }

        .product-card.selected {
            border: 2px solid #38bdf8;
            background: #1e293b;
        }

        .product-icon {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .pubg-icon { color: #f59e0b; }
        .ff-icon { color: #ef4444; }

        .product-name {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-price {
            color: #4ade80;
            font-size: 16px;
            font-weight: bold;
        }

        .buy-btn {
            width: 100%;
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(14, 165, 233, 0.3);
            transition: opacity 0.2s;
        }

        .buy-btn:active {
            opacity: 0.9;
        }

        /* نافذة الإشعارات المخصصة */
        .notification {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: #1e293b;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
            z-index: 1000;
            text-align: center;
            width: 90%;
            max-width: 400px;
            border-top: 4px solid #38bdf8;
        }

        .notification.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1 class="welcome-title"><i class="fas fa-shopping-basket"></i> متجر عبد البصير</h1>
        <p style="color: #94a3b8; font-size: 14px;">أهلاً بك في نظام الشحن الفوري الآمن</p>
        
        <div class="info-bar">
            <!-- سيقوم السيرفر باستبدال هذه القيم ديناميكياً لكل مستخدم -->
            <div class="info-item">حسابك: <span id="userId">USER_ID_MARKER</span></div>
            <div class="info-item">رصيدك الحالي: <span id="userBalance">USER_BALANCE_MARKER</span> $</div>
        </div>
    </div>

    <div class="input-group">
        <label for="playerId"><i class="fas fa-id-card"></i> معرف اللاعب الخاص بك (Player ID)</label>
        <input type="number" id="playerId" placeholder="أدخل ID اللعبة هنا بدقة" pattern="[0-9]*">
    </div>

    <h3 style="margin-bottom: 15px; color: #94a3b8;"><i class="fas fa-cubes"></i> اختر الباقة المناسبة:</h3>
    
    <div class="products-grid">
        <div class="product-card" onclick="selectProduct(this, 'pubg_60')">
            <div class="product-icon pubg-icon"><i class="fas fa-gamepad"></i></div>
            <div class="product-name">60 شدة PUBG</div>
            <div class="product-price">1.00 $</div>
        </div>
        <div class="product-card" onclick="selectProduct(this, 'pubg_325')">
            <div class="product-icon pubg-icon"><i class="fas fa-gamepad"></i></div>
            <div class="product-name">325 شدة PUBG</div>
            <div class="product-price">5.00 $</div>
        </div>
        <div class="product-card" onclick="selectProduct(this, 'ff_100')">
            <div class="product-icon ff-icon"><i class="fas fa-fire"></i></div>
            <div class="product-name">100 جوهرة Free Fire</div>
            <div class="product-price">1.00 $</div>
        </div>
        <div class="product-card" onclick="selectProduct(this, 'ff_310')">
            <div class="product-icon ff-icon"><i class="fas fa-fire"></i></div>
            <div class="product-name">310 جوهرة Free Fire</div>
            <div class="product-price">3.00 $</div>
        </div>
    </div>

    <button class="buy-btn" onclick="submitOrder()"><i class="fas fa-shopping-cart"></i> تأكيد الشراء الآن</button>

    <div id="toast" class="notification"></div>

    <script>
        let selectedItemKey = null;

        function selectProduct(card, itemKey) {
            document.querySelectorAll('.product-card').forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');
            selectedItemKey = itemKey;
        }

        function showToast(message, isSuccess = true) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.style.borderTopColor = isSuccess ? '#4ade80' : '#ef4444';
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 4000);
        }

        function submitOrder() {
            const userId = document.getElementById('userId').innerText;
            const playerId = document.getElementById('playerId').value.trim();

            if (!playerId) {
                showToast("⚠️ يرجى إدخال معرف اللاعب الخاص بك أولاً!", false);
                return;
            }
            if (!selectedItemKey) {
                showToast("⚠️ يرجى اختيار الباقة المراد شراؤها!", false);
                return;
            }

            // إرسال الطلب إلى السيرفر الخلفي المبني بـ Flask
            fetch('/api/buy', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    user_id: userId,
                    item: selectedItemKey,
                    player_id: playerId
                })
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    showToast("🎉 " + data.message, true);
                    // يمكنك تفريغ حقل المعرف بعد النجاح
                    document.getElementById('playerId').value = '';
                } else {
                    showToast("❌ " + data.message, false);
                }
            })
            .catch(err => {
                showToast("❌ حدث خطأ غير متوقع أثناء الاتصال بالسيرفر", false);
                console.error(err);
            });
        }
    </script>
</body>
</html>
